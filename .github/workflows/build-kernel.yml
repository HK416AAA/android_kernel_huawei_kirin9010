name: build-kernel

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-kernel.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Cache toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            gcc
            ${{ github.workspace }}/../../prebuilts
          key: kirin9010-toolchain-v1

      - name: Fetch toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/HK416AAA/aarch64-linux-android-4.9.git gcc
          mkdir -p "$GITHUB_WORKSPACE/../../prebuilts/clang/host/linux-x86"
          git clone --depth 1 --filter=blob:none --sparse \
            --branch android-12.0.0_r1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$GITHUB_WORKSPACE/../../prebuilts/clang/host/linux-x86"
          git -C "$GITHUB_WORKSPACE/../../prebuilts/clang/host/linux-x86" \
            sparse-checkout set clang-r416183b1
          ls -l "$GITHUB_WORKSPACE/../../prebuilts/clang/host/linux-x86/clang-r416183b1/bin/clang"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison flex libssl-dev libelf-dev bc \
            device-tree-compiler ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: kirin9010-ccache-${{ hashFiles('arch/arm64/configs/merge_8425m_defconfig') }}
          restore-keys: |
            kirin9010-ccache-

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: out
          key: kirin9010-out-${{ hashFiles('arch/arm64/configs/merge_8425m_defconfig') }}
          restore-keys: |
            kirin9010-out-

      - name: Build Image
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          defconfig = Path("arch/arm64/configs/merge_8425m_defconfig")
          lines = defconfig.read_text().splitlines()
          out = []
          for line in lines:
              if line.startswith(("CONFIG_LTO=", "CONFIG_LTO_CLANG=",
                                  "CONFIG_LTO_CLANG_FULL=",
                                  "CONFIG_CFI_CLANG=",
                                  "CONFIG_CFI_CLANG_SHADOW=")):
                  out.append("# " + line.split("=", 1)[0] + " is not set")
              elif line.startswith("# CONFIG_LTO_NONE"):
                  out.append("CONFIG_LTO_NONE=y")
              else:
                  out.append(line)
          defconfig.write_text("\n".join(out) + "\n")

          makefile = Path("Makefile")
          lines = makefile.read_text().splitlines()
          keep = [line for line in lines
                  if "-fprofile-use" not in line
                  and "--symbol-ordering-file" not in line]
          makefile.write_text("\n".join(keep) + "\n")
          print("Makefile lines removed:", len(lines) - len(keep))
          PY
          python3 - <<'PY'
          from pathlib import Path
          for name in ("platform_source/display/drivers/dpu_drm/Makefile",
                       "platform_source/display/drivers/dpu_drm/heap/Makefile"):
              path = Path(name)
              if path.exists():
                  path.write_text(path.read_text().replace(
                      "-I$(srctree)/../../vendor/hisi/ap/kernel/include", ""))
          PY
          export ARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc/bin/aarch64-linux-android-"
          export PATH="$GITHUB_WORKSPACE/../../prebuilts/clang/host/linux-x86/clang-r416183b1/bin:$PATH"
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_MAXSIZE=5G
          mkdir -p out
          make O=out merge_8425m_defconfig 2>&1 | tee out/build.log
          make O=out -j"$(nproc)" \
            KBUILD_CFLAGS="-fno-profile-use" \
            KCFLAGS="-fno-profile-use" \
            CC="ccache clang" HOSTCC="ccache clang" \
            Image 2>&1 | tee -a out/build.log
          test -s out/arch/arm64/boot/Image

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            out/arch/arm64/boot/Image
            out/System.map
            out/.config
            out/build.log
          if-no-files-found: warn
