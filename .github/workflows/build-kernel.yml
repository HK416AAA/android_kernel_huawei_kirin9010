name: build-kernel

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-kernel.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Cache toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            gcc
            ${{ github.workspace }}/../../prebuilts
          key: kirin9010-toolchain-r487747c-v1

      - name: Fetch toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/HK416AAA/aarch64-linux-android-4.9.git gcc
          mkdir -p "$GITHUB_WORKSPACE/../../prebuilts/clang/host/linux-x86"
          git clone --depth 1 --filter=blob:none --sparse \
            --branch android-14.0.0_r1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$GITHUB_WORKSPACE/../../prebuilts/clang/host/linux-x86"
          git -C "$GITHUB_WORKSPACE/../../prebuilts/clang/host/linux-x86" \
            sparse-checkout set clang-r487747c
          ls -l "$GITHUB_WORKSPACE/../../prebuilts/clang/host/linux-x86/clang-r487747c/bin/clang"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison flex libssl-dev libelf-dev bc \
            device-tree-compiler

      - name: Patch clang/PGO/LTO
        run: |
          python3 scripts/ci_patch.py
          grep -n "clang-r\|fprofile-use\|symbol-ordering" Makefile || true

      - name: Build kernel
        run: |
          set -o pipefail
          export ARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc/bin/aarch64-linux-android-"
          export PATH="$GITHUB_WORKSPACE/../../prebuilts/clang/host/linux-x86/clang-r487747c/bin:$PATH"
          rm -rf out
          mkdir -p out
          make O=out merge_8425m_defconfig 2>&1 | tee out/build.log
          make O=out -j8 2>&1 | tee -a out/build.log
          test -s out/arch/arm64/boot/Image.gz

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            out/arch/arm64/boot/Image.gz
            out/System.map
            out/.config
            out/build.log
          if-no-files-found: warn
