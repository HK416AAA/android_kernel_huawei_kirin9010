name: build-kernel

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-kernel.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Cache toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            gcc
            ${{ github.workspace }}/../../prebuilts
          key: kirin9010-toolchain-r487747c-v2

      - name: Fetch toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/HK416AAA/aarch64-linux-android-4.9.git gcc
          mkdir -p "$GITHUB_WORKSPACE/../../prebuilts/clang/host/linux-x86"
          git clone --depth 1 --filter=blob:none --sparse \
            --branch android-14.0.0_r1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$GITHUB_WORKSPACE/../../prebuilts/clang/host/linux-x86"
          git -C "$GITHUB_WORKSPACE/../../prebuilts/clang/host/linux-x86" \
            sparse-checkout set clang-r487747c
          ls -l "$GITHUB_WORKSPACE/../../prebuilts/clang/host/linux-x86/clang-r487747c/bin/clang"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison flex libssl-dev libelf-dev bc \
            device-tree-compiler

      - name: Patch clang/PGO/vendor
        run: |
          set -euo pipefail
          python3 scripts/ci_patch.py
          echo "=== init/Makefile vendor_stubs ==="
          grep -n "vendor_stubs" init/Makefile || true
          echo "=== vendor_stubs.c ==="
          ls -l init/vendor_stubs.c
          echo "=== platform_source obj-y (first 10) ==="
          grep -n "obj-y" platform_source/Makefile | head -10 || true
          echo "=== drivers/Makefile vendor obj-y (first 20) ==="
          grep -nE "obj-y \+= (connectivity|hwnet|hwpower|huawei_platform|dubai|iomt_host|sim_adapt)" \
            drivers/Makefile || true

      - name: Build kernel
        run: |
          set -o pipefail
          export ARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc/bin/aarch64-linux-android-"
          export PATH="$GITHUB_WORKSPACE/../../prebuilts/clang/host/linux-x86/clang-r487747c/bin:$PATH"
          rm -f build-*.log
          LOG="build-${{ github.run_id }}-$(date +%s).log"
          WARN="-Wno-error -Wno-error=strict-prototypes -Wno-error=int-conversion -Wno-error=implicit-int -Wno-error=unused-but-set-variable"
          rm -rf out
          mkdir -p out
          echo "=== defconfig ==="
          make O=out merge_8425m_defconfig 2>&1 | tee "$LOG"
          echo "=== compile ==="
          make O=out -k -j8 V=1 KCFLAGS="$WARN" 2>&1 | tee -a "$LOG" || true
          if [ ! -s out/arch/arm64/boot/Image.gz ]; then
            echo "=== generating weak stubs ==="
            python3 scripts/gen_stubs.py "$LOG"
            grep -q vendor_stubs2.o init/Makefile || echo "obj-y += vendor_stubs2.o" >> init/Makefile
            rm -f out/init/vendor_stubs2.o
            echo "=== relinking ==="
            make O=out -k -j8 V=1 KCFLAGS="$WARN" 2>&1 | tee -a "$LOG" || true
          fi
          echo "=== outputs ==="
          ls -l out/arch/arm64/boot/Image.gz out/vmlinux 2>&1 || true
          echo "=== undefined symbols in log ==="
          grep -c "undefined symbol" "$LOG" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            out/arch/arm64/boot/Image.gz
            out/System.map
            out/.config
            build-*.log
          if-no-files-found: warn
